# chora-kiosk-web nginx config — static SPA + API reverse proxy.
#
# Serves the Angular production bundle from /usr/share/nginx/html and
# reverse-proxies /api/* and /bff/* to the chora-gateway edge so the browser
# only ever talks to one origin (no CORS, no mixed content).
#
# The gateway is expected at http://kiosk-gateway:8080 inside the compose
# network: this root's chora-stack runs the kiosk edition as its own edge
# service, so the cloud `gateway` is not the one the kiosk talks to.

server {
    listen 8080;
    server_name _;

    # Resolve the upstream at request time via Docker's embedded DNS rather than
    # at config load: a startup-time lookup makes nginx exit when the gateway
    # container is not up yet, and compose start order is not guaranteed.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $chora_gateway http://kiosk-gateway:8080;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed, immutable assets — cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The prepared papers are copied into the bundle by the build (the `papers`
    # asset glob in angular.json); they are content-addressed by papers.sha256,
    # so they cache like the hashed assets.
    location /papers/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The entry document must revalidate so a new deploy is picked up even if
    # a browser cached it. Hashed JS/CSS stay immutable (see /assets/).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # API reverse proxy — the edge gateway (JWT validation + tenant stamping
    # happen there). kiosk-web uploads a marked test as multipart, so the
    # body limit is raised above nginx's 1 MB default.
    location /api/ {
        client_max_body_size 40m;
        proxy_pass $chora_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # BFF reverse proxy — the same edge, the /bff routes.
    location /bff/ {
        client_max_body_size 40m;
        proxy_pass $chora_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback: every non-asset, non-API path serves index.html so
    # Angular's router owns client-side routing (deep links, refreshes).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
